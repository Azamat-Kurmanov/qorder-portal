<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover обязателен: кабинет открывают с телефона и внутри
      WebView мобильного приложения, где вырез экрана и полоса жестов
      съедают края. Без него нижняя панель итога уезжает под полосу жестов
      ровно у тех, кто заказывает чаще всех.
    -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Кабинет клиента</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
