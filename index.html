<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover обязателен: кабинет открывают с телефона и внутри
      WebView мобильного приложения, где вырез экрана и полоса жестов
      съедают края. Без него нижняя панель итога уезжает под полосу жестов
      ровно у тех, кто заказывает чаще всех.
    -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Q-Order — кабинет клиента</title>
    <!--
      Размер интерфейса применяется ДО первого кадра.

      Выбор («крупный шрифт») лежит в хранилище браузера, а читает его код
      приложения — то есть уже после того, как страница нарисована. Между
      этими двумя моментами человек, выбравший крупный шрифт, увидел бы
      кабинет мелким и то, как он скачком укрупняется. Этот скрипт снимает
      разрыв: он ставит признак на корень до того, как появится что-либо.

      Инлайном, а не файлом: внешний скрипт — это ещё один запрос, за время
      которого страница успевает отрисоваться, и мигание вернётся.
      Ступени продублированы из `src/ui/fontScale.ts` — четыре слова, ради
      которых не стоит тянуть сюда сборку модулей; разойтись им не даст
      проверка `src/ui/fontScale.test.ts`, где список ступеней закреплён.
    -->
    <script>
      try {
        var scale = localStorage.getItem('q-order.portal.font-scale');
        if (scale === 'large' || scale === 'huge') {
          document.documentElement.dataset.fontScale = scale;
        }
      } catch (error) {
        // Хранилище запрещено настройками сайта — кабинет откроется обычным.
      }
      /*
        Тема — по той же причине и тем же способом: покупатель, выбравший
        тёмную (или зашедший в магазин, у которого она по умолчанию), иначе
        видел бы белую вспышку до того, как приложение прочтёт выбор.
        Сначала выбор покупателя, потом последняя тема продавца — порядок
        и ключи те же, что в `src/ui/theme.ts` (закреплены `theme.test.ts`).
      */
      try {
        var theme = localStorage.getItem('q-order.portal.theme');
        if (theme !== 'light' && theme !== 'dark') theme = localStorage.getItem('q-order.portal.theme-default');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        }
      } catch (error) {
        // Хранилище запрещено — кабинет откроется светлым.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
