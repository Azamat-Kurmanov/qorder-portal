# Раздача кабинета клиента и проксирование его запросов к API.
#
# Кабинет и API живут на одном origin намеренно. Так браузер не применяет
# к запросам правило источников вовсе: нет ни предварительных запросов,
# ни расхождений вида localhost против 127.0.0.1, ни повышения адреса до https.
# Тот же приём используется dev-сервером кабинета, и поведение стенда
# совпадает с поведением машины разработчика.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие только для текста: картинки и шрифты уже сжаты, повторное сжатие
    # тратит процессор и ничего не выигрывает.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Кабинет ничего не загружает файлами: самое большое, что он отправляет, —
    # состав заявки. Предел стоит намеренно низким, чтобы случайная или чужая
    # многомегабайтная отправка не доходила до API вовсе.
    client_max_body_size 1m;

    # Внутренний DNS Compose. Без него nginx разрешил бы имя один раз при
    # старте и продолжал бы стучаться по устаревшему адресу после перезапуска
    # или пересоздания реплики API — снаружи это выглядит как внезапный 502
    # на здоровом бэкенде.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------- запросы кабинета к API ----------
    location /api/ {
        # Имя в переменной: адрес разрешается на каждый запрос, а не при старте.
        set $api_upstream http://fastorders-api:5000;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Пустой Connection: соединение к API держится открытым, а не гасится
        # после каждого запроса — на списке из двухсот позиций это заметно.
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- служебные адреса API ----------
    # Наружу отдаются только проба и версия: по ним кабинет отличает
    # недоступный бэкенд от собственной ошибки. Метрики (/actuator/prometheus)
    # сюда намеренно не попадают — их читает Prometheus внутри сети,
    # а в браузере им делать нечего.
    location ~ ^/actuator/(info|health)(/.*)?$ {
        set $api_upstream http://fastorders-api:5000;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # Всё остальное на /actuator/ закрыто здесь, а не оставлено общему правилу:
    # иначе запрос метрик получал бы страницу кабинета с кодом 200, и отличить
    # закрытый адрес от опечатки было бы нельзя.
    location /actuator/ {
        return 404;
    }

    # ---------- статика ----------
    # У файлов сборки хэш в имени: содержимое по такому адресу не меняется
    # никогда, и браузер вправе держать его до истечения срока.
    location /assets/ {
        # Один заголовок, а не expires плюс add_header: две директивы отдают
        # два разных Cache-Control в одном ответе, и какой из них выиграет,
        # решает уже браузер.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Точка входа кэшироваться не должна: иначе после выкатки браузер продолжит
    # просить файлы старой сборки, которых в образе уже нет, и кабинет
    # встретит клиента пустым экраном.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Маршруты кабинета разбирает браузер, а не сервер: адрес вида /orders/42
    # существует только в приложении. Без возврата index.html обновление
    # страницы на любом внутреннем экране давало бы 404 — и первым под удар
    # попадал бы переход по ссылке приглашения.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
